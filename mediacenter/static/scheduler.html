<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定时任务 - OpenWrt MediaCenter</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #fff;
    --border: #e3e5e8;
    --text: #222;
    --muted: #707684;
    --accent: #2f6feb;
    --accent-hover: #1d56cc;
    --danger: #d23f3f;
    --warn: #d28a2a;
    --ok: #2a9b5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand {
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
  }
  .nav-tabs {
    display: flex;
    gap: 4px;
    flex: 1;
  }
  .nav-tabs a {
    color: var(--muted);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 5px;
    font-size: 14px;
  }
  .nav-tabs a:hover { background: #f0f2f5; color: var(--text); }
  .nav-tabs a.active {
    background: var(--accent);
    color: #fff;
  }
  .toolbar { display: flex; gap: 8px; }
  main { padding: 20px 24px; }
  button {
    font: inherit;
    cursor: pointer;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 5px;
  }
  button:hover { background: #f0f2f5; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger { color: var(--danger); border-color: #f0c4c4; }
  button.danger:hover { background: #fbeaea; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table {
    width: 100%;
    background: var(--panel);
    border-collapse: collapse;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  thead th { background: #fafbfc; font-weight: 600; color: var(--muted); }
  tbody tr:last-child td { border-bottom: none; }
  tr.builtin { color: var(--muted); }
  tr.builtin td.actions button:not(.run) { display: none; }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #eef1f4;
    color: var(--muted);
  }
  .badge.user { background: #e6f0ff; color: var(--accent); }
  .badge.shell { background: #fff5e1; color: var(--warn); }
  .badge.python { background: #e6f6ed; color: var(--ok); }
  .status-ok { color: var(--ok); }
  .status-bad { color: var(--danger); }
  .actions { white-space: nowrap; }
  .actions button { margin-right: 4px; }
  .empty {
    padding: 32px;
    text-align: center;
    color: var(--muted);
  }
  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    border-radius: 8px;
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    overflow: auto;
    padding: 20px 24px;
  }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-weight: 500; color: var(--muted); font-size: 12px; }
  .field input[type=text],
  .field input[type=number],
  .field textarea {
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    background: #fff;
  }
  .field textarea {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    min-height: 280px;
    resize: vertical;
  }
  .field input:disabled { background: #f3f4f6; color: var(--muted); }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .help.error { color: var(--danger); }
  .help.success { color: var(--ok); }
  .radio-group { display: flex; gap: 12px; padding: 4px 0; }
  .radio-group label { display: flex; align-items: center; gap: 4px; font-weight: normal; color: var(--text); font-size: 14px; }
  pre.log {
    background: #1f2227;
    color: #e6e9ee;
    border-radius: 4px;
    padding: 12px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 60vh;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #2f343d;
    color: #fff;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 13px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    z-index: 200;
  }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="brand">MediaCenter</div>
  <nav class="nav-tabs">
    <a href="/ui/">播放器</a>
    <a href="/ui/scheduler.html" class="active">定时任务</a>
  </nav>
  <div class="toolbar">
    <button onclick="refresh()">刷新</button>
    <button class="primary" onclick="openCreate()">+ 新建任务</button>
  </div>
</header>
<main>
  <table id="jobs-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>名称</th>
        <th>Cron</th>
        <th>类型</th>
        <th>启用</th>
        <th>上次运行</th>
        <th>状态</th>
        <th>来源</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="jobs-tbody"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">还没有任务，点击 "+ 新建任务" 添加一个</div>
</main>

<!-- Edit/create modal -->
<div id="edit-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h2 id="edit-title">新建任务</h2>
    <div class="row">
      <div class="field">
        <label>ID（创建后不可修改）</label>
        <input id="f-id" type="text" placeholder="例: backup_logs">
      </div>
      <div class="field">
        <label>名称</label>
        <input id="f-name" type="text" placeholder="给任务起个名字">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Cron 表达式（5 字段：分 时 日 月 周）</label>
        <input id="f-cron" type="text" placeholder="*/5 * * * *" oninput="onCronChange()">
        <div id="cron-help" class="help">填写后会预览接下来的 3 次触发时间</div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>脚本类型</label>
        <div class="radio-group">
          <label><input type="radio" name="runtime" value="shell" checked> Shell</label>
          <label><input type="radio" name="runtime" value="python"> Python</label>
        </div>
      </div>
      <div class="field">
        <label>超时（秒）</label>
        <input id="f-timeout" type="number" min="1" value="300">
      </div>
      <div class="field">
        <label>启用</label>
        <div class="radio-group" style="padding-top: 8px">
          <label><input id="f-enabled" type="checkbox" checked> 创建后立即调度</label>
        </div>
      </div>
    </div>
    <div class="field">
      <label>脚本内容</label>
      <textarea id="f-script" placeholder="#!/bin/sh&#10;echo hello"></textarea>
    </div>
    <div id="form-error" class="help error" style="display:none"></div>
    <div class="modal-actions">
      <button onclick="closeEdit()">取消</button>
      <button id="save-btn" class="primary" onclick="saveJob()">保存</button>
    </div>
  </div>
</div>

<!-- Log modal -->
<div id="log-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h2 id="log-title">运行日志</h2>
    <pre id="log-content" class="log">(加载中...)</pre>
    <div class="modal-actions">
      <button onclick="closeLog()">关闭</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let editingId = null;          // null 表示新建
let cronPreviewTimer = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || `HTTP ${res.status}`);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("json") ? res.json() : res.text();
}

function toast(msg, isError = false) {
  const el = $("toast");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 2500);
}

function fmtTime(s) {
  if (!s) return "—";
  return s.replace("T", " ");
}

function statusClass(s) {
  if (!s) return "";
  if (s === "ok") return "status-ok";
  return "status-bad";
}

async function refresh() {
  try {
    const { jobs } = await api("/api/scheduler/jobs");
    const tbody = $("jobs-tbody");
    tbody.innerHTML = "";
    if (!jobs.length) {
      $("empty").style.display = "block";
      return;
    }
    $("empty").style.display = "none";
    for (const j of jobs) {
      const isUser = j.source === "user";
      const tr = document.createElement("tr");
      tr.className = isUser ? "user" : "builtin";
      const runtimeOrType = j.runtime
        ? `<span class="badge ${j.runtime}">${j.runtime}</span>`
        : `<span class="badge">${j.type || "—"}</span>`;
      tr.innerHTML = `
        <td><code>${j.id}</code></td>
        <td>${j.name || j.id}</td>
        <td><code>${j.cron || "—"}</code></td>
        <td>${runtimeOrType}</td>
        <td>${j.enabled ? "✓" : "—"}</td>
        <td>${fmtTime(j.last_run)}</td>
        <td class="${statusClass(j.last_status)}">${j.last_status || "—"}</td>
        <td><span class="badge ${isUser ? "user" : ""}">${isUser ? "用户" : "内置"}</span></td>
        <td class="actions">
          <button class="run" onclick="runJob('${j.id}')">运行</button>
          <button onclick="viewLog('${j.id}')">日志</button>
          <button onclick="openEdit('${j.id}')">编辑</button>
          <button class="danger" onclick="deleteJob('${j.id}')">删除</button>
        </td>
      `;
      tbody.appendChild(tr);
    }
  } catch (e) {
    toast("加载失败: " + e.message, true);
  }
}

function openCreate() {
  editingId = null;
  $("edit-title").textContent = "新建任务";
  $("f-id").value = "";
  $("f-id").disabled = false;
  $("f-name").value = "";
  $("f-cron").value = "";
  $("f-timeout").value = 300;
  $("f-enabled").checked = true;
  document.querySelector('input[name=runtime][value=shell]').checked = true;
  $("f-script").value = "#!/bin/sh\necho hello\n";
  $("form-error").style.display = "none";
  $("cron-help").className = "help";
  $("cron-help").textContent = "填写后会预览接下来的 3 次触发时间";
  $("edit-modal").style.display = "flex";
}

async function openEdit(id) {
  try {
    const job = await api(`/api/scheduler/jobs/${encodeURIComponent(id)}`);
    editingId = id;
    $("edit-title").textContent = `编辑任务: ${id}`;
    $("f-id").value = job.id;
    $("f-id").disabled = true;
    $("f-name").value = job.name || "";
    $("f-cron").value = job.cron || "";
    $("f-timeout").value = job.timeout || 300;
    $("f-enabled").checked = job.enabled !== false;
    const r = job.runtime || "shell";
    document.querySelector(`input[name=runtime][value=${r}]`).checked = true;
    $("f-script").value = job.script || "";
    $("form-error").style.display = "none";
    $("edit-modal").style.display = "flex";
    onCronChange();
  } catch (e) {
    toast("加载任务失败: " + e.message, true);
  }
}

function closeEdit() {
  $("edit-modal").style.display = "none";
}

function onCronChange() {
  const expr = $("f-cron").value.trim();
  if (!expr) {
    $("cron-help").className = "help";
    $("cron-help").textContent = "填写后会预览接下来的 3 次触发时间";
    return;
  }
  clearTimeout(cronPreviewTimer);
  cronPreviewTimer = setTimeout(async () => {
    try {
      const { next } = await api(`/api/scheduler/cron-preview?expr=${encodeURIComponent(expr)}&n=3`);
      $("cron-help").className = "help success";
      $("cron-help").textContent = "下次触发: " + next.map(s => s.replace("T", " ")).join("  /  ");
    } catch (e) {
      $("cron-help").className = "help error";
      $("cron-help").textContent = "无效的 cron 表达式";
    }
  }, 250);
}

async function saveJob() {
  const id = $("f-id").value.trim();
  const cron = $("f-cron").value.trim();
  const runtime = document.querySelector('input[name=runtime]:checked').value;
  const body = {
    id,
    name: $("f-name").value.trim() || id,
    cron,
    runtime,
    enabled: $("f-enabled").checked,
    timeout: parseInt($("f-timeout").value, 10) || 300,
    script: $("f-script").value,
  };
  $("form-error").style.display = "none";
  $("save-btn").disabled = true;
  try {
    if (editingId === null) {
      await api("/api/scheduler/jobs", { method: "POST", body: JSON.stringify(body) });
      toast("任务已创建");
    } else {
      await api(`/api/scheduler/jobs/${encodeURIComponent(editingId)}`, {
        method: "PUT",
        body: JSON.stringify(body),
      });
      toast("任务已更新");
    }
    closeEdit();
    refresh();
  } catch (e) {
    $("form-error").textContent = e.message;
    $("form-error").style.display = "block";
  } finally {
    $("save-btn").disabled = false;
  }
}

async function runJob(id) {
  try {
    await api(`/api/scheduler/jobs/${encodeURIComponent(id)}/run`, { method: "POST" });
    toast(`已触发: ${id}`);
    setTimeout(refresh, 500);
  } catch (e) {
    toast("运行失败: " + e.message, true);
  }
}

async function deleteJob(id) {
  if (!confirm(`确定删除任务 "${id}" ？脚本和日志会一起被删除。`)) return;
  try {
    await api(`/api/scheduler/jobs/${encodeURIComponent(id)}`, { method: "DELETE" });
    toast("已删除");
    refresh();
  } catch (e) {
    toast("删除失败: " + e.message, true);
  }
}

async function viewLog(id) {
  $("log-title").textContent = `运行日志: ${id}`;
  $("log-content").textContent = "(加载中...)";
  $("log-modal").style.display = "flex";
  try {
    const text = await api(`/api/scheduler/jobs/${encodeURIComponent(id)}/log`);
    $("log-content").textContent = text || "(尚无日志)";
  } catch (e) {
    $("log-content").textContent = "加载失败: " + e.message;
  }
}

function closeLog() {
  $("log-modal").style.display = "none";
}

window.addEventListener("DOMContentLoaded", refresh);
</script>
</body>
</html>
